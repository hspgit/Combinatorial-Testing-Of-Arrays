name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Strict type check with mypy
        run: |
          mypy

      - name: Run test suite with pytest & coverage
        run: |
          pytest --cov=cit_tools --cov-report=term-missing --cov-report=xml

      - name: CLI smoke test
        run: |
          cit-tools --version
          cit-tools report old/new_test.txt
          cit-tools coverage old/test1.txt old/test3.txt -t 2 3 --format json
          cit-tools saturation old/test1.txt
          cit-tools chi-square old/test1.txt -t 2 --values
