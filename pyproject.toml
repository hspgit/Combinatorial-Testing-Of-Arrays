[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cit-tools"
version = "1.0.0"
description = "Quality metrics for combinatorial test designs: t-way coverage, chi-square balance, chi-square efficiency and degree of saturation."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["combinatorial testing", "covering arrays", "orthogonal arrays", "design of experiments", "chi-square"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cit-tools = "cit_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cit_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/cit_tools", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cit_tools"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PL", "N"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
